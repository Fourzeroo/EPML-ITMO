data:
  raw_path: data/raw/train.csv
  processed_path: data/processed/train_processed.csv
  test_size: 0.2
  features:
  - Pclass
  - Sex
  - Age
  - SibSp
  - Parch
  - Fare
  - Embarked
  target: Survived
model:
  name: GradientBoosting
  _target_: sklearn.ensemble.GradientBoostingClassifier
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 5
  random_state: ${random_state}
train:
  cv_folds: 5
  scoring: f1
  save_model: true
  model_path: models/model.pkl
experiment_name: titanic-pipeline
random_state: 42
